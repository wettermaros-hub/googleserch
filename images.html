<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Vyhledávání obrázků pomocí Googlu.">
    <title>Vyhledávání obrázků</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="search-page">
    <header class="topbar">
      <nav class="top-links" aria-label="Hlavní navigace">
        <a href="index.html">Vyhledávání Google</a>
        <a href="advanced.html">Rozšířené hledání</a>
        <a href="forms.html">Formuláře</a>
        <a href="https://wettermaros-hub.github.io/portfolio.html">Portfolio</a>
      </nav>
    </header>

    <main class="search-main image-main">
      <a class="google-logo" href="index.html" aria-label="Domů">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        <span class="image-label">Obrázky</span>
      </a>
      <form class="search-form" action="https://www.google.com/search" method="get">
        <input type="hidden" name="tbm" value="isch">
        <label class="visually-hidden" for="image-query">Hledat obrázky</label>
        <div class="search-box">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="image-query" type="search" name="q" title="Hledat obrázky" autocomplete="off" required>
        </div>
        <div class="search-actions">
          <button type="submit">Vyhledávání obrázků Google</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <p class="footer-label">Česká republika</p>
      <div class="footer-links">
        <a href="https://github.com/wettermaros-hub/googlesearch/blob/main/citace.md">Citace a zdroje</a>
        <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fwettermaros-hub.github.io%2Fgooglesearch%2Fimages.html">Validovat HTML této stránky</a>
        <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fwettermaros-hub.github.io%2Fgooglesearch%2Fstyles.css&amp;profile=css3svg&amp;usermedium=all&amp;warning=1&amp;lang=cs">Validovat CSS</a>
      </div>
    </footer>
  </body>
</html>
